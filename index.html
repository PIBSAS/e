<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e</title>
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <link rel="manifest" href="static/site.webmanifest">
    <script src="service-worker.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }
        
        #fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        #logo {
            margin: 20px auto;
            width: 256px;
            height: auto;
            text-align: center;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        #logo img {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .pdfs-container {
            display: grid;
            gap: 20px;
            justify-items: center;
            padding: 20px;
        }

        .pdfs-container.few-1 { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; }
        .pdfs-container.few-2 { grid-template-columns: repeat(2, 1fr); max-width: 700px; margin: 0 auto; }
        .pdfs-container:not(.few-1):not(.few-2) { grid-template-columns: repeat(3, 1fr); max-width: 100%; margin: 0 auto; }


        .pdf-container {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background: #fff;
            transition: transform 0.2s;
            width: 100%;
            max-width: 332px;
        }
        
        .pdf-container:hover {
            transform: scale(1.05);
        }
        
        .pdf-thumbnail {
            width: 100%;
            height: auto;
            cursor: pointer;
            display: block;
        }

        .pdf-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .pdf-row-few {
            justify-content: center;
        }
        
        .pdf-title {
            text-align:center;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        
        @media (max-width: 768px) {
            #pdfs-container {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media (max-width: 480px) {
            #pdfs-container {
                grid-template-columns: 1fr;
            }
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px 0;
            color: #555;
            font-size: 14px;
        }
        
        footer img {
            max-width: 50px;
            margin-bottom: 5px;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        footer p {
            margin: 0;
            font-size: 14px;
            color: #555;
        }
        
        h2 {
            background-color: rgba(255, 255, 255, 0.8); 
            color: #333;                             
            text-align: center;                        
            padding: 10px 0;                            
            margin: 20px 40px;                      
            border-radius: 10px;                    
            width: calc(100% - 80px);                               
            box-sizing: border-box;                       
        }
        
        #modal-visor {
            display: none;
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 9999;
        }
        
        #modal-visor iframe {
            width:100%; height:100%;
            display:block;
            border:none;
        }
        
        #modal-visor .cerrar {
            position:absolute; top:50px; right:10px;
            font-size:30px; color:green;
            cursor:pointer;
            z-index: 10000;
        }
    </style>
    
    <div id="fondo"></div>
    <script>
    const fondo = document.getElementById('fondo');
    let hue = 0;
    function animateBackground() {
        hue = (hue + 0.5) % 360;
        fondo.style.background = `linear-gradient(135deg, hsl(${hue}, 70%, 80%), hsl(${(hue+60)%360}, 70%, 80%))`;
        requestAnimationFrame(animateBackground);
    }
    animateBackground();
</script>
<script>
    function abrirPDF(pdf) {
        const modal = document.getElementById('modal-visor');
        const iframe = document.getElementById('visor-pdf');
        iframe.src = `static/pdfjs/web/viewer.html?file=${encodeURIComponent(pdf)}`;
        modal.style.display = 'block';
    }
    function cerrarModal() {
        const modal = document.getElementById('modal-visor');
        const iframe = document.getElementById('visor-pdf');
        iframe.src = '';
        modal.style.display = 'none';
    }
</script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register("service-worker.js").then(function(registration) {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, function(err) {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</head>
<body>
    <div id="logo">
        <img src="static/logo.webp" alt="e">
    </div>
<h2>Lecturas Recomendadas</h2>
<div class="pdfs-container {clase_grid}">

            <div class="pdf-container">
                <img src="static/esp32_datasheet_en.webp" class="pdf-thumbnail" onclick="abrirPDF('/e/esp32_datasheet_en.pdf')">
                <p class="pdf-title">Esp32 datasheet en</p>
            </div>
</div>
<h2>ESP32 WROOM 32</h2>
<div class="pdfs-container {clase_grid}">

            <div class="pdf-container">
                <img src="static/esp32-wroom-32_datasheet_en.webp" class="pdf-thumbnail" onclick="abrirPDF('/e/ESP32 WROOM 32/esp32-wroom-32_datasheet_en.pdf')">
                <p class="pdf-title">Esp32 wroom 32 datasheet en</p>
            </div>
</div>

<div id="modal-visor">
    <span class="cerrar" onclick="cerrarModal()">&times;</span>
    <iframe id="visor-pdf"></iframe>
</div>
<h2>Ejercicios Resueltos en Video</h2>
<div class="pdfs-container few-1">
    <iframe width="560" height="315"
            src="https://www.youtube.com/embed/videoseries?si=iwcMW8_lYOMiyxTW&amp;list=PLCWTDHDLBfYK9_3pgykvzmkpJqszL0kFi"
            title="Ejercicios Resueltos en video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
    </iframe>
</div>
<footer>
<img src="static/logo.webp" alt="{folder_name}">
<p>© 2025 Física Web App</p>
</footer>
</body>
</html>
